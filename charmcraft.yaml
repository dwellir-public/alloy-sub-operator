name: alloy-sub
type: charm
title: Grafana Alloy Subordinate
summary: Subordinate charm for workload-local metrics and logs using Grafana Alloy.
description: |
  alloy-sub is a machine subordinate that attaches to a principal over juju-info,
  consumes workload observability declarations over machine-observability, scrapes
  workload-local metrics, captures journald and file logs, and forwards telemetry
  to Loki and Prometheus-compatible remote write backends.

  One alloy-sub application serves one principal application; deploy the charm
  again under another application name for each further principal.

platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

subordinate: true

config:
  options:
    # An example config option to customise the log level of the workload
    log-level:
      description: |
        Configures the log level of alloy.
      default: "info"
      type: string
    systemd-service:
      description: |
        Exact systemd unit name to collect from the principal machine's journal,
        for example my-app.service. An empty value adds no journal source.
        This unit is collected alongside systemd_units declared through the
        machine-observability relation; duplicate unit names are collected once.
        Collection works with only a juju-info attachment and can coexist with
        host metrics and file logs. Configure send-loki-logs or
        grafana-cloud-config to forward collected logs to Loki.
      default: ""
      type: string
    custom-args:
      description: |
        Custom arguments for the Alloy service.
        Hard coded args, that must not be set here:
        --server.http.listen-addr=0.0.0.0:6987
        --config.file=/etc/alloy/config.alloy
      default: ""
      type: string
    loki-url:
      description: |
        The URL of the Loki service to send logs to.
        Loki endpoints provided by the send-loki-logs or grafana-cloud-config
        relations take precedence for rendered log forwarding.
      type: string
      default: ""
    log-files:
      description: |
        Absolute file paths or globs to collect alongside relation-provided logs.
        Separate multiple paths with semicolons, for example
        /tmp/example.log;/var/log/my-app/*.log. Whitespace and empty entries are
        ignored. An empty value adds no file sources. Files must be readable by
        Alloy on the principal machine. New files are read from the beginning,
        then followed. The path_exclude option also applies to these sources.
        A Loki destination is required to forward the logs.
      type: string
      default: ""
    path_exclude:
      description: |
        Semi-colon separated file log exclude patterns appended to workload excludes.
      type: string
      default: ""
    global_scrape_interval:
      description: |
        Default scrape interval used when metrics jobs omit one.
        Relation-provided scrape intervals in machine-observability metrics
        endpoints take precedence.
      type: string
      default: "1m"
    global_scrape_timeout:
      description: |
        Default scrape timeout used when metrics jobs omit one.
        Relation-provided scrape timeouts in machine-observability metrics
        endpoints take precedence.
      type: string
      default: "10s"
    enable-host-metrics:
      description: |
        Collect host-level metrics using Alloy's built-in node_exporter
        (prometheus.exporter.unix). No process is installed on the machine and no
        port is opened; the exporter runs inside Alloy and its metrics are
        forwarded over remote write, carrying the principal's Juju topology
        labels. This job scrapes every 60s regardless of global_scrape_interval.
        When enabled, the leader also publishes host disk and memory usage alert
        rules (80% warning, 90% critical) over send-remote-write.
        Default collectors emit roughly a thousand series per host, so leave this
        off where remote write volume is a concern.
      type: boolean
      default: false
    profiles_scrape_interval:
      description: |
        How often Alloy pulls each pprof profile from profiling-source targets,
        as a Go duration (for example 10s or 1m). When process_cpu or fgprof is
        enabled, CPU is captured for the interval minus 1s, so the interval must
        be longer than 2s.
      type: string
      default: "15s"
    tls_insecure_skip_verify:
      description: |
        Skip TLS verification for rendered scrape jobs when true.
      type: boolean
      default: false
    static-labels:
      description: |
        Static labels added to everything this application sends to Mimir and
        Loki, host metrics and the principal's metrics and logs alike. Format:
        comma-separated name=value pairs, for example
        gateway_region=dc1,environment=production. Whitespace around names,
        values and commas is trimmed and empty entries are ignored. Names must
        match [A-Za-z_][A-Za-z0-9_]*, must not start with juju_ or __, and must
        not be job or instance. Values must be non-empty. At most 16 labels,
        each name and value at most 128 characters. An invalid value blocks the
        unit and leaves the running configuration unchanged. Profiles are not
        labelled.
      type: string
      default: ""
    queue_size:
      description: |
        Queue size for outbound telemetry buffering.
      type: int
      default: 1000
    max_elapsed_time_min:
      description: |
        Maximum retry window in minutes for outbound telemetry.
      type: int
      default: 5

actions:
  adopt-alloy:
    description: |
      Take ownership of an Alloy that is already installed on this machine from
      the alloy deb package and is not managed by another unit. The installed
      version is kept. The existing config is preserved at
      /etc/alloy/config.alloy.package-default, and Alloy keeps running on that
      config until the unit has its relations. On the first reconcile with
      relations the charm writes its rendered config and restarts Alloy; from
      then on, anything the old config collected that the charm does not render
      stops being collected. The charm restores the preserved config whenever
      the unit has no relations.
    params:
      force:
        type: boolean
        default: false
        description: |
          Also take over from the unit recorded as the current owner. Use only
          when that unit no longer exists; two managers on one Alloy overwrite
          each other.
    additionalProperties: false

requires:
  juju-info:
    interface: juju-info
    scope: container
    limit: 1
  machine-observability:
    interface: machine_observability
    scope: container
    optional: true
    limit: 1
  send-loki-logs:
    interface: loki_push_api
    optional: true
  send-remote-write:
    interface: prometheus_remote_write
    optional: true
  grafana-cloud-config:
    interface: grafana_cloud_config
    optional: true
  profiling-source:
    interface: pprof_scrape
    scope: container
    optional: true
    limit: 1
    description: pprof targets the principal publishes for Alloy to pull.
  send-profiles:
    interface: profiling
    optional: true
    limit: 1
    description: |
      Pyroscope to push profiles to, using Pyroscope's native ingest on the advertised
      host:port. Relate to pyroscope-vm:profiling. Not compatible with OTLP-only receivers
      such as opentelemetry-collector:receive-profiles.

peers:
  alloy-peers:
    interface: alloy_sub_peers

parts:
  cos-tool:
    plugin: dump
    source: https://github.com/canonical/cos-tool/releases/download/rel-20260713/cos-tool-amd64
    source-type: file
    source-checksum: sha256/1952c30d009e5a94bb9d7174116a5ed5f05b18b37bcf39854468b81728247acd
    organize:
      cos-tool-amd64: cos-tool-amd64
    override-prime: |
      craftctl default
      chmod 0755 "$CRAFT_PRIME/cos-tool-amd64"
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

  templates:
    plugin: dump
    source: .
    prime:
      - "./templates/*"
